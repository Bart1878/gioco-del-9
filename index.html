<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gioco del 9</title>
</head>
<body>
  <h1>Gioco del 9</h1>
  <p>Scegli un numero da 1 a 9</p>

  <input type="number" id="numero" min="1" max="9">
  <button onclick="gioca()">Gioca</button>

  <p id="risultato"></p>

  <script>
    const numeroVincente = Math.floor(Math.random() * 9) + 1;

    function gioca() {
      const scelta = document.getElementById("numero").value;
      if (scelta == numeroVincente) {
        document.getElementById("risultato").innerText = "🎉 Hai vinto!";
      } else {
        document.getElementById("risultato").innerText = "❌ Hai perso! Il numero era " + numeroVincente;
      }
    }
  </script>
</body>
</html>
